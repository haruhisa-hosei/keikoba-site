<h2 class="section-title">能管の稽古</h2>
<p>能楽の笛「能管（のうかん）」は、息と響きの制御が要です。基本の構え・息の当て方から、音色の芯、メリ／カリ、間合いまで、段階的に稽古します。</p>
<h2 class="section-title">対象</h2>
<ul>
  <li>邦楽・和太鼓・祭囃子などで笛の基礎がある方</li>
  <li>能管に取り組みたい方（初心者歓迎）</li>
</ul>
<h2 class="section-title">場所</h2>
<p>東京（中央区）／千葉（佐倉）など。詳細は稽古場ページをご確認ください。</p>
